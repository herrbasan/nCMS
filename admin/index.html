<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>nCMS</title>
<!-- NUI runtime (submodule assets, served at /nui by server.js) -->
<link rel="stylesheet" href="/nui/css/nui-theme.css">
<link rel="stylesheet" href="/nui/css/modules/nui-list.css">
<link rel="stylesheet" href="/admin/css/admin.css">
<script type="module" src="/admin/js/list.js"></script>
</head>
<body>

<header class="bar">
	<span class="brand">nCMS</span>
	<!-- Collection switcher — the one navigation the list needs: which data type
	     is in view. Populated from GET /cols. -->
	<nui-select id="col-picker">
		<select></select>
	</nui-select>
	<span class="count" id="count"></span>
</header>

<main class="stage">
	<!-- The main show: one nui-list, always holding the FULL set. Nothing is
	     paginated; you narrow it by search, sort and filter. -->
	<div class="list-col">
		<div class="list-host"><nui-list id="list"></nui-list></div>
	</div>
	<!-- Detail pane. Opens when an entry is activated. -->
	<aside class="detail-col" id="detail" hidden></aside>
</main>

</body>
</html>
