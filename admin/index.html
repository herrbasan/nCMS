<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>nCMS</title>

	<!-- NUI theme + the two addons this screen uses. Addons need BOTH their JS and their CSS. -->
	<link rel="stylesheet" href="/nui/css/nui-theme.css">
	<link rel="stylesheet" href="/nui/css/modules/nui-list.css">
	<link rel="stylesheet" href="/nui/css/modules/nui-code-editor.css">
	<link rel="stylesheet" href="/admin/css/admin.css">

	<script type="module" src="/nui/nui.js"></script>
	<script type="module" src="/nui/lib/modules/nui-list.js"></script>
	<script type="module" src="/nui/lib/modules/nui-code-editor.js"></script>
</head>
<body>
	<!-- Immediate children of nui-app, in order. The header carries app identity and global
	     controls; the current scope belongs to the page, not to the shell. -->
	<nui-app content-min-width="60rem">
		<nui-skip-links></nui-skip-links>

		<nui-app-header>
			<header>
				<div slot="left">
					<nui-button data-action="toggle-sidebar" variant="icon">
						<button type="button" aria-label="Toggle navigation">
							<nui-icon name="menu"></nui-icon>
						</button>
					</nui-button>
					<h1>nCMS</h1>
				</div>
				<div slot="center"></div>
				<div slot="right"></div>
			</header>
		</nui-app-header>

		<!-- The sidebar's inner element is the link list itself: it carries its own navigation
		     landmark, so a <nav> wrapper would nest a second one. -->
		<nui-sidebar behavior="primary">
			<nui-link-list id="axis" mode="tree" aria-label="Collections"></nui-link-list>
		</nui-sidebar>

		<nui-content>
			<nui-main>
				<div class="admin-shell">
					<header class="admin-page-header">
						<h1 id="scope"></h1>
						<p class="admin-page-meta" id="count"></p>
					</header>
					<div class="admin-pane" id="pane"></div>
				</div>
			</nui-main>
		</nui-content>
	</nui-app>

	<script type="module" src="/admin/js/app.js"></script>
</body>
</html>
